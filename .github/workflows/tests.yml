
name: CI Agent Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Docker image
        run: docker build -t ci-agent-test ./sample_project

      - name: Run tests inside Docker
        run: docker run --rm ci-agent-test
