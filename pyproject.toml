
[project]
name = "ci-agent"
version = "0.1.0"
description = "AI-powered bug investigation and code repair using Ollama, Docker, and pytest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "gitpython>=3.2.0",
    "pydantic>=2.14.0",
    "pygithub>=2.10.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
